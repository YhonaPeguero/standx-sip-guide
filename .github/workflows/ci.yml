name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A second push to the same PR makes the first run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build and checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Every locale carries the English key set — no missing or orphaned keys.
      - name: Check i18n coverage
        run: node scripts/check-i18n-coverage.mjs

      # Every t() call in src resolves to a key that exists.
      - name: Check i18n usage
        run: node scripts/check-i18n-usage.mjs

      # The simulator's invariants, including that an unentered rate yields zero gain and
      # that the accrual stays simple rather than compounding.
      - name: Check simulator math
        run: node scripts/check-simulator-math.mjs

      # The simulator's rate copy keeps saying SIP-3 sits inside the DUSD rate, in every
      # locale, and never presents a rate as a fixed protocol APY.
      - name: Check simulator copy
        run: node scripts/check-simulator-copy.mjs
